- aid: przelewy24:przelewy24-recursion-dopayment-api
  name: Przelewy24 Recursion (doPayment) API
  description: >-
    In order to register a recurring transaction, it is necessary to send transaction registration request
    first to  <a href="#tag/Transaction-service-API/paths/~1api~1v1~1transaction~1register/post">/transaction/register</a>
    endpoint. . For the transaction to be performed, the `“cardData”` object must be added in the transaction
    registration request.

     ```json
     {
       "cardData": {
         "means": {
           "card": {
             "pan": "1234123412341234",
             "expYear": "2027",
             "expMonth": "01",
             "clientName": "Name and surname",
             "securityCode": "123"
           }
         },
         "transcationType": "recurring",
         "traceID": ""
       }
     }
     ```

     Description of the specific parameters of the object:
     - the `"card"` object contains card data such as:
       - `"pan"` - 16-digit card number
       - `"expYear"` - card expiry year
       - `"expMonth"` - card expiry month
       - `"securityCode"` – CVV/CVC code
     - `"transactionType"` - takes the “recurring” value
     - `"traceID"` - initiating transaction reference number (required for recurring, if the following
    have been provided: card, schemeToken)

     Provided that all the parameters in the <a href="#tag/Transaction-service-API/paths/~1api~1v1~1transaction~1register/post">
    transaction registration </a>request are correct, a token required for  `transaction/doPayment` request
    is returned in response.
